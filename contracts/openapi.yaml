openapi: 3.1.0
info:
  title: coc-pointer API
  version: 0.5.0
  description: |
    클래시 오브 클랜 클랜 "미니언즈"의 클랜원과 점수를 다루는 API.

    이 파일이 계약이다. 서버 모델과 프론트 타입은 여기서 생성하며
    손으로 고치지 않는다. scripts/generate-from-contract.sh 참고.

servers:
  - url: https://coc-api.coc-api.workers.dev
    description: 운영

paths:
  /api/v1/members:
    get:
      operationId: listMembers
      summary: 클랜원 목록
      tags: [members]
      parameters:
        - name: tag
          in: query
          required: false
          description: 플레이어 태그로 좁힌다. '#'을 포함해 넘긴다
          schema:
            type: string
            example: "#2ABC123"
      responses:
        "200":
          description: 클랜원 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"

components:
  schemas:
    ClanRole:
      type: string
      description: |
        게임 안 직책. CoC API 표기를 대문자로 바꾼 값이다.
        ADMIN 은 게임 화면에서 "장로(Elder)"로 불린다.
        UNKNOWN 은 CoC 가 우리가 모르는 값을 보냈다는 뜻이다.
      enum: [LEADER, COLEADER, ADMIN, MEMBER, UNKNOWN]

    MemberStatus:
      type: string
      description: |
        클랜 소속 여부. CoC API 가 주지 않고 우리가 판정한다.
        목록에 있으면 ACTIVE, 사라지면 INACTIVE 로 내린다.
      enum: [ACTIVE, INACTIVE]

    Member:
      type: object
      required:
        - id
        - tag
        - name
        - role
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: 우리 식별자
        tag:
          type: string
          description: CoC 플레이어 태그
          example: "#2ABC123"
        name:
          type: string
        role:
          $ref: "#/components/schemas/ClanRole"
        status:
          $ref: "#/components/schemas/MemberStatus"
        townhall:
          type: integer
          nullable: true
        trophies:
          type: integer
          nullable: true
        donations:
          type: integer
          nullable: true
        donationsReceived:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
          description: 관리자 메모. 동기화가 덮어쓰지 않는다
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MemberListResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
