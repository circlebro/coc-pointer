openapi: 3.1.0
info:
  title: coc-pointer API
  version: 0.6.0
  description: |
    클래시 오브 클랜 클랜 "미니언즈"의 클랜원과 점수를 다루는 API.

    이 파일이 API 스펙이다. 서버 모델과 프론트 타입은 여기서 생성하며
    손으로 고치지 않는다. scripts/generate-from-contract.sh 참고.

servers:
  - url: https://coc-api.coc-api.workers.dev
    description: 운영

paths:
  /api/v1/members:
    get:
      operationId: listMembers
      summary: 클랜원 목록
      tags: [members]
      parameters:
        - name: tag
          in: query
          required: false
          description: 플레이어 태그로 좁힌다. '#'을 포함해 넘긴다
          schema:
            type: string
            example: "#2ABC123"
      responses:
        "200":
          description: 클랜원 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"

  /api/v1/clans:
    get:
      operationId: listClans
      summary: 클랜 목록
      description: |
        우리가 다루는 클랜. 지금은 미니언즈 하나뿐이다.

        마크·레벨·점수·전적은 담지 않는다. CoC 가 주인인 값이라 우리가
        사본을 들고 있으면 두 곳에서 관리하게 되고 언젠가 어긋난다.
        필요하면 external_id 로 CoC 에 물으면 된다.
      tags: [clans]
      responses:
        "200":
          description: 클랜 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClanListResponse"

components:
  schemas:
    ClanStatus:
      type: string
      description: |
        우리가 이 클랜을 다루는가. CoC 가 주지 않고 우리가 판정한다.
        MemberStatus 와 값이 같지만 뜻이 다르다. 이쪽은 "우리 관심사인가"이고
        저쪽은 "클랜에 남아 있는가"다. 한쪽만 값이 늘 수 있으므로 따로 둔다.
      enum: [ACTIVE, INACTIVE]

    Clan:
      type: object
      description: |
        CoC 가 모르는 값만 담는다. 마크·레벨·점수·전적은 CoC 가 주인이라
        우리가 사본을 들면 두 곳에서 관리하게 된다.

        id 는 우리 식별자이고 externalId 는 CoC 세계의 식별자다. 주소에서
        '#' 을 인코딩하지 않으려고 따로 둔다.

        이름조차 우리가 관리한다. 게임에서 클랜 이름을 바꿔도 우리 표기는
        그대로 둘 수 있고, 태그는 바뀌지 않으므로 그것으로 찾는다.
      required:
        - id
        - externalId
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: 우리 식별자(UUID 문자열)
          example: "3f2a1b4c-5d6e-4f70-8a91-b2c3d4e5f607"
        externalId:
          type: string
          description: CoC 클랜 태그. 이 값으로 CoC API 를 부른다
          example: "#2C8L822LQ"
        displayName:
          type: string
          nullable: true
          description: 우리가 붙이는 이름. 첫 동기화 때 채운다
          example: "미니언즈"
        status:
          $ref: "#/components/schemas/ClanStatus"
        createdAt:
          type: string
          description: 처음 본 시각. ISO 8601(UTC)
          example: "2026-09-11T07:18:57Z"
        updatedAt:
          type: string
          description: 마지막으로 갱신한 시각. ISO 8601(UTC)
          example: "2026-09-11T07:18:57Z"

    ClanListResponse:
      type: object
      required: [clans]
      properties:
        clans:
          type: array
          items:
            $ref: "#/components/schemas/Clan"

    ClanRole:
      type: string
      description: |
        게임 안 직책. CoC API 표기를 대문자로 바꾼 값이다.
        ADMIN 은 게임 화면에서 "장로(Elder)"로 불린다.
        UNKNOWN 은 CoC 가 우리가 모르는 값을 보냈다는 뜻이다.
      enum: [LEADER, COLEADER, ADMIN, MEMBER, UNKNOWN]

    MemberStatus:
      type: string
      description: |
        클랜 소속 여부. CoC API 가 주지 않고 우리가 판정한다.
        목록에 있으면 ACTIVE, 사라지면 INACTIVE 로 내린다.
      enum: [ACTIVE, INACTIVE]

    Member:
      type: object
      required:
        - id
        - tag
        - name
        - role
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: 우리 식별자
        tag:
          type: string
          description: CoC 플레이어 태그
          example: "#2ABC123"
        name:
          type: string
        role:
          $ref: "#/components/schemas/ClanRole"
        status:
          $ref: "#/components/schemas/MemberStatus"
        townhall:
          type: integer
          nullable: true
        trophies:
          type: integer
          nullable: true
        donations:
          type: integer
          nullable: true
        donationsReceived:
          type: integer
          nullable: true
        description:
          type: string
          nullable: true
          description: 관리자 메모. 동기화가 덮어쓰지 않는다
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MemberListResponse:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
