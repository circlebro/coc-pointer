# Cloudflare Workers 설정.
# 배포는 ./deploy.sh 로 한다. database_id 는 그 스크립트가 채운다.
name = "coc-api"
main = "src/worker.py"
compatibility_date = "2026-09-01"
compatibility_flags = ["python_workers"]

[vars]
API_VERSION = "0.5.0"

[[d1_databases]]
binding = "DB"
database_name = "coc-pointer"
database_id = "PUT_D1_ID_HERE"

[observability]
enabled = true
