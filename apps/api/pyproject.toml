[project]
name = "coc-api"
version = "0.5.0"
description = "coc-pointer API 서버 (Cloudflare Python Workers)"
authors = [
    { name = "박원형", email = "circle@mz.co.kr" }
]
requires-python = ">=3.14"
dependencies = [
    "coc-core",
    "fastapi>=0.115",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.0",
    "workers-py",
    "workers-runtime-sdk",
]

# apps/api 는 파이썬 휠이 아니라 Cloudflare Workers 번들로 배포된다 (deploy.sh 가
# pywrangler 를 거쳐 올린다). src/ 에 db.py·worker.py 가 모듈로 직접 놓여
# `uv_build` 가 기대하는 src/<패키지명>/ 구조가 아니므로 uv 의 빌드·설치
# 대상에서 빼고, 의존성만 워크스페이스에 반영되게 한다.
[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
