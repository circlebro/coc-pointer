[project]
name = "coc-api"
version = "0.5.0"
description = "coc-pointer API 서버 (Cloudflare Python Workers)"
authors = [
    { name = "박원형", email = "circle@mz.co.kr" }
]
requires-python = ">=3.14"
dependencies = [
    "coc-core",
    "fastapi>=0.115",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "httpx>=0.28.1",
    "pytest-asyncio>=1.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
