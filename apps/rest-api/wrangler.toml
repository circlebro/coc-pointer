# Cloudflare Workers 설정.
# 배포는 ./deploy.sh 로 한다. database_id 는 그 스크립트가 채운다.
name = "coc-api"
main = "src/worker.py"
compatibility_date = "2026-09-01"
compatibility_flags = ["python_workers"]

# 여기 적는 값은 저장소에 남는다. 배포 환경마다 달라지는 값과 바깥에 알릴
# 이유가 없는 값은 여기 두지 않고 비밀값으로 넣는다.
#
#   cd apps/rest-api
#   npx wrangler@4 secret put COC_API_TOKEN
#   npx wrangler@4 secret put CLAN_TAG
#
# 비밀값은 일반 변수와 같은 자리(env)에 붙으므로 읽는 코드는 달라지지 않는다.
[vars]
API_VERSION = "0.6.0"

[[d1_databases]]
binding = "DB"
database_name = "coc-pointer"
database_id = "779ac2d3-a93d-4a9e-9a98-fb67918a8a95"
# 이 database 블록 안에 두어야 한다. 최상위에 두면 wrangler 가 모르는 항목으로
# 흘려보내고 기본 경로(apps/rest-api/migrations)를 보아, 마이그레이션이 하나도
# 적용되지 않은 채 배포가 성공한 것처럼 끝난다.
migrations_dir = "database/migrations"

[observability]
enabled = true
