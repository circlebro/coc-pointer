[project]
name = "coc-pointer"
version = "0.5.0"
description = "Clash of Clans clan point score tracker"
authors = [
    { name = "박원형", email = "circle@mz.co.kr" }
]
requires-python = ">=3.14"
dependencies = [
    "coc-core",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
]

[project.scripts]
coc-pointer = "coc_pointer:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
# 루트 pyproject.toml 과 같은 이유로 둔다. pytest 는 인자에 따라 다른 설정
# 파일을 고르므로 범위마다 같은 설정이 있어야 한다.
addopts = "--import-mode=importlib"
testpaths = ["tests"]
