# 배포. main 에 들어가면 돈다.
#
# 개발 서버가 없어 여기서 나가는 것이 곧 운영이다. 그래서 두 가지를 지킨다.
#
# 1. 검사(check.yml)가 통과한 것만 나간다. 아래 needs 를 보라
# 2. API 를 먼저, 화면을 나중에 올린다. 응답 모양이 바뀌면 화면이 먼저 올라갈 때
#    표가 빈다 — 옛 API 가 주는 응답에 새 필드가 없기 때문이다
#
# 작업 아이디(jobs 아래 열쇠)는 ASCII 여야 한다. 한글로 적으면 GitHub 이 파일을
# 아예 못 읽고 0초 만에 실패한다. 화면에 보일 이름은 name: 으로 따로 준다.
#
# 사람이 누르는 단계는 두지 않았다. 승인을 두면 누군가 눌러야 하고, 안 누르면
# 배포가 멈춘다. 지금은 배포가 느려지는 손해가 사고 위험보다 크다고 보았다.
# 사고가 한 번 나면 그 균형이 뒤집히고, 그때 GitHub Environment 승인을 붙인다.
# 근거는 docs/deploy-guide.md 9번.
name: deploy

on:
  push:
    branches: [main]
  # 되돌릴 때나 배포만 다시 하고 싶을 때 손으로 부른다.
  workflow_dispatch:

# collect.yml 이 30분마다 자료를 main 에 커밋하는데, 그것 때문에 이 배포가
# 돌지는 않는다. GITHUB_TOKEN 으로 민 푸시는 다른 워크플로를 부르지 않는다는
# 것이 GitHub 의 규칙이다. 자료가 바뀌면 collect.yml 이 화면만 다시 올린다.

concurrency:
  # 배포는 겹치면 안 된다. 앞의 것을 취소하지 않고 기다린다 — 배포 도중에
  # 끊기면 무엇이 올라갔는지 알 수 없다.
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 검사를 여기서 한 번 더 돌린다. check.yml 이 PR 에서 이미 돌았지만, 머지
  # 커밋은 그때와 다른 코드다 — 다른 PR 이 먼저 들어갔을 수 있다.
  check:
    name: 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 설치
        run: uv sync --frozen

      - name: 테스트
        run: uv run pytest -q

      - name: 서식과 규칙
        run: |
          uv run ruff check .
          uv run ruff format --check .

  api:
    name: API
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 설치
        run: uv sync --frozen

      # deploy.sh 가 CLOUDFLARE_API_TOKEN 이 있으면 브라우저 로그인을 건너뛴다.
      # 마이그레이션도 이 안에서 걸린다 — 아직 안 건 것만 걸리므로 여러 번
      # 돌려도 안전하다.
      - name: 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ./apps/rest-api/deploy.sh

      # 올라간 것이 실제로 답하는지 본다. 배포가 성공한 것처럼 끝나고 첫 요청에서
      # 죽은 적이 있다(pyyaml 이 번들에서 빠졌을 때). 그래서 여기서 한 번 부른다.
      - name: 살아 있는지 확인
        run: |
          for i in $(seq 1 10); do
            body=$(curl -sf https://coc-api.coc-api.workers.dev/api/health) && break
            echo "아직 안 뜸. 다시 시도 $i/10"
            sleep 5
          done
          echo "$body"
          echo "$body" | grep -q '"coc_core":"ok"' || {
            echo "✘ coc_core 가 ok 가 아닙니다."
            exit 1
          }

  web:
    name: 화면
    needs: api
    runs-on: ubuntu-latest
    # collect.yml 도 Pages 에 올린다. 둘이 같은 순간에 겹치면 뒤엣것이 실패하므로
    # 한 줄로 세운다. 워크플로가 달라도 이름이 같으면 같은 줄에 선다.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 설치
        run: uv sync --frozen

      # 화면이 두 벌이다. 파이썬(Jinja2)이 만드는 옛 페이지들과, React 가 맡은
      # /members/ 다. 둘을 차례로 돌려 site/ 에 합친다. collect.yml 과 같은
      # 방식이며, 한 페이지씩 React 로 옮겨 가는 중이라 당분간 이 모양이다.
      - name: 옛 페이지 빌드
        run: uv run coc-pointer build

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 클랜원 화면 빌드
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: 빌드 결과를 site/members/ 로
        run: |
          # 먼저 지운다. 파이썬 빌드가 옛 members/ 를 남겼을 수 있고, 그것이
          # 남아 있으면 새 화면이 덮이지 않는다.
          rm -rf site/members
          mkdir -p site/members
          cp -R apps/web/dist/. site/members/
          test -f site/members/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
