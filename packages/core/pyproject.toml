[project]
name = "coc-core"
version = "0.5.0"
description = "coc-pointer 공용 코드: 자료형, 설정, 점수 계산, 보상 판정"
authors = [
    { name = "박원형", email = "circle@mz.co.kr" }
]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
