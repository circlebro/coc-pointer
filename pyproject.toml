[project]
name = "coc-pointer"
version = "0.1.0"
description = "Clash of Clans clan point score tracker"
readme = "README.md"
authors = [
    { name = "박원형", email = "circle@mz.co.kr" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
coc-pointer = "coc_pointer:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
