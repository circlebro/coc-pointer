# 저장소 루트. 실제 파이썬 패키지는 apps/ 와 packages/ 에 있고, 여기서는 작업 공간만 선언한다.
# 이렇게 두면 루트에서 `uv run coc-pointer ...` 로 바로 실행할 수 있다.
[tool.uv.workspace]
members = ["apps/web", "apps/api", "packages/core"]

[tool.uv.sources]
coc-pointer = { workspace = true }
coc-core = { workspace = true }
coc-api = { workspace = true }

[project]
name = "coc-pointer-workspace"
version = "0.0.0"
description = "coc-pointer 저장소 루트 (apps/web, apps/api, packages/core)"
requires-python = ">=3.14"
dependencies = ["coc-pointer"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "pytest-asyncio>=1.0",
    # apps/api(coc-api)는 [tool.uv] package = false 라 워크스페이스 의존성 해석에
    # 끼지 않는다. 루트에서 `uv sync` 한 번으로 apps/api 테스트까지 돌리려면
    # coc-api 가 쓰는 런타임/테스트 의존성을 여기 그대로 적어 둬야 한다.
    "fastapi>=0.115",
    "httpx>=0.28.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["apps/web/tests", "apps/api/tests", "packages/core/tests"]
asyncio_mode = "auto"
pythonpath = ["apps/api/src"]
