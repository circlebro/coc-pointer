<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ clan_name }} 클랜전 점수{% endblock %}</title>
<link rel="stylesheet" href="{{ root }}style.css?v={{ asset_version }}">
</head>
<body>
<header>
  <div class="bar">
    <h1><a href="{{ root }}">{{ clan_name }} 클랜전 점수</a></h1>
    <div class="updated" title="30분마다 자동 수집·갱신. 끝난 클랜전만 반영">마지막 갱신 <time>{{ generated_at }}</time><br><small>한국 시간 · 30분마다 자동 갱신</small></div>
  </div>
  <nav>
    <label class="month-select">월
      <select onchange="location.href=this.value">
        {% for m in months_desc %}<option value="{{ root }}{{ m.key }}/"{% if current_key == m.key %} selected{% endif %}>{{ m.key[:4] }}/{{ m.key[5:] }}</option>{% endfor %}
      </select>
    </label>
    <noscript>{% for m in months_desc %}<a href="{{ root }}{{ m.key }}/">{{ m.key[:4] }}/{{ m.key[5:] }}</a> {% endfor %}</noscript>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>마지막 갱신: {{ generated_at }} (한국 시간) · 30분마다 자동 갱신, 끝난 클랜전만 반영</footer>
</body>
</html>
